<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 固定ヘッダー -->
  <header class="menu">
    <img src="F.png" alt="F" id="FLEX">
    <a href="ABOUT.html">ABOUT</a>
    <a href="NEWS.html">NEWS</a>
    <a href="MEMBER.html">MEMBER</a>
    <a href="SPONSOR.html">SPONSOR</a>
    <a href="CONTACT.html">CONTACT</a>
  </header>

  <!-- Hero セクション -->
  <section class="hero">
    <img class="hero-img" src="top.png" alt="F">
    <h1 class="hero-text">FLEX and Conqer</h1>
  </section>

  <!-- メニューセクション（Heroの下） -->
  <main class="content">
    <section class="center-section">
      <p>NEWS</p>
      <button>MORE</button>
    </section>
    <section class="center-section">
      <p>MEMBER</p>
      <button>MORE</button>    
    </section>
    <section class="center-section">
      <p>ABOUT</p>
      <button>MORE</button>  
    </section>
    <section class="center-section">
      <p>CONTACT</p>
      <button>MORE</button>
    </section>  
  </main>

  <!-- スクロールで半透明にするスクリプト -->
  <script>
    window.addEventListener("scroll", function() {
      const header = document.querySelector(".menu");
      header.style.backgroundColor = window.scrollY > 50
        ? "rgba(196, 30, 58, 0.6)"
        : "rgba(196, 30, 58, 1)";
    });
  </script>

</body>
</html>
